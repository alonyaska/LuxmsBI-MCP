[project]
name = "luxms-mcp"
version = "0.1.0"
description = "MCP server for Luxms BI: read cubes/data, build dashboards"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.2,<2", "httpx>=0.27", "pydantic>=2"]

[project.scripts]
luxms-mcp = "luxms_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luxms_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
